name: Build Android artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and upload APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # This project has native and studio product flavors. Generic assembleDebug and
      # bundleRelease tasks are ambiguous and do not create the paths uploaded below.
      - name: Run tests and build all distributable variants
        run: |
          ./gradlew --no-daemon \
            :app:testNativeDebugUnitTest \
            :app:testStudioDebugUnitTest \
            :app:assembleNativeDebug \
            :app:assembleStudioDebug \
            :app:assembleNativeRelease \
            :app:bundleNativeRelease

      - name: Verify generated artifacts
        run: |
          test -f app/build/outputs/apk/native/debug/app-native-debug.apk
          test -f app/build/outputs/apk/studio/debug/app-studio-debug.apk
          test -f app/build/outputs/apk/native/release/app-native-release-unsigned.apk
          test -f app/build/outputs/bundle/nativeRelease/app-native-release.aab
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print | sort

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: LeakCanaryScenarios-debug-APKs-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/native/debug/app-native-debug.apk
            app/build/outputs/apk/studio/debug/app-studio-debug.apk

      - name: Upload native release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: LeakCanaryScenarios-native-release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/native/release/app-native-release-unsigned.apk
            app/build/outputs/bundle/nativeRelease/app-native-release.aab
